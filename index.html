<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pterodactyl (Beta) - Arcc Channel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial,sans-serif}
header{display:flex;align-items:center;gap:15px;padding:12px 16px;background:#0f0f0f;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:900}
.logo span{color:#ff0000}
.search{flex:1;background:#272727;border:none;padding:10px 14px;border-radius:20px;color:#fff;outline:none}
.btn-upload{background:#ff0000;color:#fff;border:none;padding:9px 16px;border-radius:20px;font-weight:700;cursor:pointer}
.status{font-size:12px;padding:6px 10px;border-radius:20px;background:#1a3a1a;color:#4ade80}
.main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{cursor:pointer}
.thumb{width:100%;aspect-ratio:16/9;background:#272727;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb video{width:100%;height:100%;object-fit:cover}
.title{font-weight:700;margin-top:10px;line-height:1.4}
.meta{color:#aaa;font-size:13px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal.open{display:flex}
.box{background:#1a1a1a;padding:22px;border-radius:16px;width:100%;max-width:480px}
.box h2{margin-bottom:14px}
.box input,.box textarea{width:100%;background:#272727;border:none;color:#fff;padding:12px;border-radius:10px;margin-bottom:10px;outline:none}
.box button{width:100%;background:#ff0000;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:800;cursor:pointer}
.close{float:right;cursor:pointer;font-size:22px}
.player{position:fixed;inset:0;background:#000;display:none;z-index:100;flex-direction:column}
.player.open{display:flex}
.player video{width:100%;flex:1;background:#000}
.player-top{padding:12px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header>
<div class="logo">▶ Ptero<span>(Beta)</span></div>
<input class="search" id="search" placeholder="Cari video..." oninput="render()">
<div class="status" id="status">● Cek Server...</div>
<button class="btn-upload" onclick="openModal()">+ Upload</button>
</header>
<div class="main"><div class="grid" id="grid"></div><p id="empty" style="color:#aaa;text-align:center;margin-top:40px;display:none">Belum ada video. Upload dulu bro!</p></div>

<div class="modal" id="modal"><div class="box"><span class="close" onclick="closeModal()">✕</span><h2>Upload Video</h2><input id="judul" placeholder="Judul video..."><textarea id="desc" placeholder="Deskripsi..."></textarea><input id="channel" placeholder="Nama Channel (default Arcc Channel)"><input type="file" id="file" accept="video/*"><input type="file" id="thumbFile" accept="image/*"><p style="font-size:12px;color:#aaa;margin-bottom:10px">Thumbnail opsional, kalo kosong pake emoji 🎬</p><button onclick="doUpload()" id="btnUp">Upload Sekarang</button><p id="prog" style="font-size:13px;margin-top:10px;color:#4ade80"></p></div></div>

<div class="player" id="player"><div class="player-top"><b id="pTitle"></b><button onclick="closePlayer()" style="background:#ff0000;color:#fff;border:none;padding:8px 14px;border-radius:20px;cursor:pointer">✕ Tutup</button></div><video id="pVideo" controls autoplay></video><p id="pDesc" style="padding:12px;color:#aaa"></p></div>

<script>
const API = 'https://pictures-garbage-devoted-modelling.trycloudflare.com';
let videos = [];
async function load(){
  try{
    const r = await fetch(API + '/api/videos');
    videos = await r.json();
    document.getElementById('status').textContent = '● ONLINE - ' + videos.length + ' Video';
    render();
  }catch(e){
    document.getElementById('status').textContent = '● OFFLINE - Cek Ptero!';
    document.getElementById('status').style.background = '#3a1a1a';
    document.getElementById('status').style.color = '#ff6b6b';
  }
}
function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('grid');
  const list = videos.filter(v => v.judul.toLowerCase().includes(q));
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  grid.innerHTML = list.map(v => `
    <div class="card" onclick="playVideo(${v.id})">
      <div class="thumb">${v.thumb && v.thumb.startsWith('/thumbs') ? `<img src="${API}${v.thumb}">` : (v.thumb || '🎬')}</div>
      <div class="title">${v.judul}</div>
      <div class="meta">${v.channel} • ${v.views}</div>
    </div>`).join('');
}
function playVideo(id){
  const v = videos.find(x => x.id === id);
  document.getElementById('pTitle').textContent = v.judul;
  document.getElementById('pDesc').textContent = v.desc || '';
  document.getElementById('pVideo').src = API + v.link;
  document.getElementById('player').classList.add('open');
}
function closePlayer(){ document.getElementById('pVideo').pause(); document.getElementById('player').classList.remove('open'); }
function openModal(){ document.getElementById('modal').classList.add('open'); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
async function doUpload(){
  const file = document.getElementById('file').files[0];
  if(!file) return alert('Pilih video dulu!');
  const btn = document.getElementById('btnUp');
  btn.textContent = 'Lagi Upload... Sabar...';
  btn.disabled = true;
  document.getElementById('prog').textContent = 'Upload ' + (file.size/1024/1024).toFixed(1) + ' MB ke Ptero...';
  const fd = new FormData();
  fd.append('video', file);
  fd.append('judul', document.getElementById('judul').value || file.name);
  fd.append('desc', document.getElementById('desc').value);
  fd.append('channel', document.getElementById('channel').value || 'Arcc Channel');
  const thumbFile = document.getElementById('thumbFile').files[0];
  if(thumbFile){
    const reader = new FileReader();
    reader.onload = async e => {
      fd.append('thumb', e.target.result);
      await kirim(fd, btn);
    };
    reader.readAsDataURL(thumbFile);
  } else {
    fd.append('thumb', '🎬');
    await kirim(fd, btn);
  }
}
async function kirim(fd, btn){
  try{
    const r = await fetch(API + '/api/upload', { method:'POST', body: fd });
    const j = await r.json();
    if(j.success){ alert('BERHASIL! Video masuk!'); closeModal(); load(); }
    else alert('Gagal: ' + j.error);
  }catch(e){ alert('Gagal konek ke server! Cek Ptero masih jalan gak?'); }
  btn.textContent = 'Upload Sekarang'; btn.disabled = false;
}
load();
</script>
</body>
</html>
